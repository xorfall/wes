version: 1
name: Private domain results remain private
steps:
  - name: Private sample
    run: 'sensor sample > sample'
  - name: Private classification
    run: ':calc pure { return httpStatus($sample.status); } > analysis'
    expect:
      - {name: Correct received status, condition: '$analysis.code == 200'}
  - name: Extract private status
    run: ':calc { return $analysis.code; } > status'
  - name: Private definition lookup
    run: ':calc pure { return httpStatus($status); } > definition'
    expect:
      - {name: Correct classification, condition: '$definition.class == "success"'}
