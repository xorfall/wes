version: 1
name: HTTP response definitions and validation
steps:
  - name: Status definition
    run: ':calc pure { return httpStatus("404"); } > not_found'
    expect:
      - {name: Discoverable category, condition: '$not_found.code == 404 && $not_found.class == "client-error"'}
  - name: Error definition
    run: ':calc pure { return httpError("HTTP007"); } > response_error'
    expect:
      - {name: Response boundary category, condition: '$response_error.known && $response_error.category == "response"'}
  - name: Successful call
    run: 'sensor sample > sample'
  - name: Classify success
    run: ':calc pure { return httpStatus($sample.status); } > successful_analysis'
    expect:
      - {name: Received success status, condition: '$successful_analysis.code == 200 && $successful_analysis.class == "success"'}
  - name: Missing resource
    run: 'sensor missing > missing *> missing_error'
    expect:
      - {name: Received status, condition: '$missing.status == 404'}
  - name: Classify missing
    run: ':calc pure { return httpStatus($missing.status); } > missing_analysis'
    expect:
      - {name: Received 404 is data, condition: '$missing_analysis.code == 404 && $missing_analysis.class == "client-error"'}
  - name: Invalid request
    run: 'sensor invalid > invalid'
    expect:
      - {name: Received validation response, condition: '$invalid.status == 422'}
  - name: Invalid response JSON
    run: 'sensor bad > bad'
    expect:
      - {name: Original unreadable body retained, condition: '$bad.validation.state == "unreadable" && $bad.bodyKind == "bytes"'}
  - name: Classify received status independently from body validity
    run: ':calc pure { return httpStatus($bad.status); } > bad_analysis'
    expect:
      - {name: Response status does not prove a valid body, condition: '$bad_analysis.code == 200 && $bad.validation.state == "unreadable"'}
  - name: Extract received validation facts
    run: ':calc pure { return [{status:$bad.status,validation:$bad.validation.state}]; } > findings'
  - name: Tabulate facts
    run: '$findings > findings_table'
