version: 1
package: http-domain-demo
targets:
  local: {kind: local}
environments:
  demo:
    imports:
      sensor:
        source: {kind: spec, file: sensor.json}
        bind: {target: local, endpoint: http://127.0.0.1:8767}
  private:
    imports:
      sensor:
        source: {kind: spec, file: sensor.json}
        bind: {target: local, endpoint: http://127.0.0.1:8767, output: private}
