version: 1
name: Direct HTTP 404 remains a response value
steps:
  - name: Request
    run: 'http request url:"http://127.0.0.1:8767/missing" > response'
  - name: Classify received response status
    run: ':calc pure { return httpStatus($response.status); } > analysis'
    expect:
      - {name: Received 404 classification, condition: '$analysis.code == 404 && $analysis.class == "client-error"'}
