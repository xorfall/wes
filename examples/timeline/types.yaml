version: 1
types:
  TimelineKind: {base: Text, enum: [timeline]}
  TimelineGroupKind: {base: Text, enum: [timeline-group]}
  TimelineKey: {base: Text, minLength: 1, maxLength: 128}
  TimelineText: {base: Text, maxLength: 2048}
  TimelineSample:
    base: Record
    fields: {id: TimelineKey, at: Instant, value: 'Union<Int, Decimal>', gap: Bool}
  TimelineSeries:
    base: Record
    fields: {id: TimelineKey, label: TimelineText, unit: TimelineText, samples: 'List<TimelineSample>'}
  TimelineEvent:
    base: Record
    fields: {id: TimelineKey, at: Instant, label: TimelineText, detail: TimelineText}
  Timeline:
    base: Record
    fields:
      view: TimelineKind
      id: TimelineKey
      title: TimelineText
      range: Interval
      coverage: Interval
      omitted: Int
      sourceError: TimelineText
      series: 'List<TimelineSeries>'
      events: 'List<TimelineEvent>'
  TimelineGroup:
    base: Record
    fields: {view: TimelineGroupKind, title: TimelineText, range: Interval}
  TimeRange:
    base: Record
    fields: {start: Instant, end: Instant}
  TimelineItem:
    base: Record
    fields: {source: Text, series: Text, id: Text, at: Instant, value: Text}
  TimeState:
    base: Record
    fields: {viewport: TimeRange, cursor: 'Option<Instant>', selection: 'Option<TimeRange>', draft: 'Option<TimeRange>', selectedItem: 'Option<TimelineItem>'}
  CursorKind: {base: Text, enum: [cursor]}
  ViewportKind: {base: Text, enum: [viewport]}
  SelectionKind: {base: Text, enum: [selection, selection-preview]}
  ItemKind: {base: Text, enum: [item]}
  CursorEvent:
    base: Record
    fields: {kind: CursorKind, at: 'Option<Instant>'}
  ViewportEvent:
    base: Record
    fields: {kind: ViewportKind, range: TimeRange}
  SelectionEvent:
    base: Record
    fields: {kind: SelectionKind, range: 'Option<TimeRange>'}
  ItemEvent:
    base: Record
    fields: {kind: ItemKind, item: 'Option<TimelineItem>'}
  TimeEvent: {base: 'Union<CursorEvent, Union<ViewportEvent, Union<SelectionEvent, ItemEvent>>>'}

  AdapterAccepted: {base: Bool, enum: [true]}
  AdapterCount: {base: Int, min: 0, max: 1000000}
  AdapterSuccess: {base: Text, enum: [success]}
  PrometheusMatrixKind: {base: Text, enum: [matrix]}
  PrometheusPair: {base: 'List<Union<Int, Union<Decimal, Text>>>', minItems: 2, maxItems: 2}
  PrometheusSamples: {base: 'List<PrometheusPair>', maxItems: 10000}
  PrometheusSeries:
    base: Record
    fields: {metric: Record, values: PrometheusSamples}
  PrometheusMatrix:
    base: Record
    fields: {resultType: PrometheusMatrixKind, result: PrometheusSeriesList}
  PrometheusRange:
    base: Record
    fields: {status: AdapterSuccess, data: PrometheusMatrix}
  LokiStreamsKind: {base: Text, enum: [streams]}
  LokiPair: {base: 'List<Text>', minItems: 2, maxItems: 2}
  LokiRows: {base: 'List<LokiPair>', maxItems: 10000}
  LokiStream:
    base: Record
    fields: {stream: Record, values: LokiRows}
  LokiStreams:
    base: Record
    fields: {resultType: LokiStreamsKind, result: LokiStreamList}
  LokiRange:
    base: Record
    fields: {status: AdapterSuccess, data: LokiStreams}
  PrometheusSeriesList: {base: 'List<PrometheusSeries>', maxItems: 128}
  LokiStreamList: {base: 'List<LokiStream>', maxItems: 128}
