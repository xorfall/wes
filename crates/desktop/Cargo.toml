[package]
name = "wes-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Native desktop shell hosting the wes engine and browser client in one process"

[dependencies]
wes-budgets.workspace = true
tracing.workspace = true
wes = { path = "../app" }
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6"] }
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSUserDefaults", "NSString"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile.workspace = true
reqwest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
