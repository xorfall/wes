[workspace]
members = [
    "crates/budgets",
    "crates/core",
    "crates/views",
    "crates/language",
    "crates/engine",
    "crates/adapters",
    "crates/app",
    "crates/desktop",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "MIT"

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
wes-budgets = { path = "crates/budgets" }
wes-core = { path = "crates/core" }
wes-views = { path = "crates/views" }
wes-language = { path = "crates/language" }
wes-engine = { path = "crates/engine" }
wes-adapters = { path = "crates/adapters" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bigdecimal = "0.4"
indexmap = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
base64 = "0.23"
csv = "1.4"
cap-std = "4"
cap-fs-ext = "4"
rustix = { version = "1.1", features = ["fs"] }
tempfile = "3"
thiserror = "2"
secrecy = { version = "0.10", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
url = "2"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
h2 = "0.4"
http = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
yaml-rust2 = { version = "0.12", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
# Keep file/line backtraces without full type and variable debug information.
# The test profile inherits this setting.
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
